<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <title>Multiverse Store - Inicio</title>
  <!-- esta es al seccion del bootstrap -->
  <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

  <!-- barra de navegacion -->
  <nav class="navbar navbar-expand-lg navbar-light bg-light">
    <a class="navbar-brand font-weight-bold text-primary" href="index.html">Multiverse Store</a>
    <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav ml-auto">
        <li class="nav-item active">
          <a class="nav-link" href="index.html">Inicio <span class="sr-only">(current)</span></a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="categorias.html">Categorías</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="contacto.html">Contacto</a>
        </li>
      </ul>
    </div>
  </nav>

  <!-- inicio -->
  <div class="container mt-4">
    <!-- encabezado de bienvenida -->
    <div class="jumbotron text-center bg-primary text-white">
      <h1 class="display-4">¡Bienvenidos a Multiverse Store!</h1>
      <p class="lead">Encuentra la mejor tecnología y seguridad para tu hogar o negocio.</p>
    </div>

    <!-- carrusel de imagenes -->
    <h2 class="text-center mb-4">Productos Destacados</h2>
    <div id="carouselExampleIndicators" class="carousel slide mb-5" data-ride="carousel">
      <ol class="carousel-indicators">
        <li data-target="#carouselExampleIndicators" data-slide-to="0" class="active"></li>
        <li data-target="#carouselExampleIndicators" data-slide-to="1"></li>
      </ol>
      <div class="carousel-inner">
        <div class="carousel-item active">
          <img src="imagenes/kitAlarmasInteligentesCarrusel.jpg" alt="Kit de Alarmas" style="max-width: 300px; height: auto;">
        </div>
        <div class="carousel-item">
          <img src="imagenes/camarasHDCarrusel.jpg" alt="Cámaras HD" style="max-width: 300px; height: auto;">
        </div>
      </div>
      <a class="carousel-control-prev" href="#carouselExampleIndicators" role="button" data-slide="prev">
        <span class="carousel-control-prev-icon" aria-hidden="true"></span>
        <span class="sr-only">Anterior</span>
      </a>
      <a class="carousel-control-next" href="#carouselExampleIndicators" role="button" data-slide="next">
        <span class="carousel-control-next-icon" aria-hidden="true"></span>
        <span class="sr-only">Siguiente</span>
      </a>
    </div>

  <footer class="bg-light text-center py-4 mt-5 border-top">
    <p class="text-muted mb-0">&copy; 2026 Multiverse Store. Todos los derechos reservados.</p>
  </footer>

  <!-- bootstrap JS- Popper.js - jQuery -->
  <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.4/dist/umd/popper.min.js"></script>
  <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
