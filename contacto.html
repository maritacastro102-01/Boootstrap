<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <title>Multiverse Store - Contacto</title>
  <!-- botstrap -->
  <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

  <!-- barra de navegacion -->
  <nav class="navbar navbar-expand-lg navbar-light bg-light">
    <a class="navbar-brand font-weight-bold text-primary" href="index.html">Multiverse Store</a>
    <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav ml-auto">
        <li class="nav-item">
          <a class="nav-link" href="index.html">Inicio</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="categorias.html">Categorías</a>
        </li>
        <li class="nav-item active">
          <a class="nav-link" href="contacto.html">Contacto <span class="sr-only">(current)</span></a>
        </li>
      </ul>
    </div>
  </nav>

  <!-- formulario de contacto -->
  <div class="container mt-5" style="max-width: 600px;">
    <h2 class="mb-4 text-center">Formulario de Contacto</h2>
    <p class="text-center text-muted mb-4">¿Tienes dudas sobre nuestros productos o instalaciones? Escríbenos y te responderemos a la brevedad.</p>
    
    <form>
      <div class="form-group">
        <label for="nombre">Nombre:</label>
        <input type="text" class="form-control" id="nombre" placeholder="Ingrese su nombre" required>
      </div>
      <div class="form-group">
        <label for="email">Email:</label>
        <input type="email" class="form-control" id="email" placeholder="Ingrese su correo electrónico" required>
      </div>
      <div class="form-group">
        <label for="mensaje">Mensaje:</label>
        <textarea class="form-control" id="mensaje" rows="4" placeholder="Escriba su consulta aquí..." required></textarea>
      </div>
      <button type="submit" class="btn btn-primary btn-block">Enviar Mensaje</button>
    </form>
  </div>

  <!-- pie de la pagina -->
  <footer class="bg-light text-center py-4 mt-5 border-top">
    <p class="text-muted mb-0">&copy; 2026 Multiverse Store. Todos los derechos reservados.</p>
  </footer>

<!-- bootstrap JS- Popper.js - jQuery -->
  <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.4/dist/umd/popper.min.js"></script>
  <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</body>
</html>
